[package]
name = "server-ntex-http"
version = "0.1.0"
edition = "2021"

# Published ntex 2.x, the version people install. Its thread-per-core "neon"
# runtime only exists in the unreleased 4.0 beta line, whose HTTP layer does
# not build, so stable ntex runs on tokio here. The runtime difference is
# called out where the numbers are reported; the echo comparison isolates the
# IO layer on the same neon runtime separately.
[dependencies]
ntex = { version = "2", features = ["tokio"] }

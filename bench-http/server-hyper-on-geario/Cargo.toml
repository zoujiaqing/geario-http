[package]
name = "server-hyper-on-geario"
version = "0.1.0"
edition = "2024"

[features]
# Force a driver instead of letting geario pick. Default on Linux tries
# io_uring and falls back to polling, so "which one ran" is not obvious.
uring = ["geario/neon-uring"]
polling = ["geario/neon-polling"]

# hyper's protocol over geario's IO and workers. No tokio runtime.
[dependencies]
geario = { path = "../../../geario/geario" }
geario-http = { path = "../../geario-http", default-features = false, features = ["hyper-rt"] }
hyper = { version = "1.11", features = ["http1", "server"] }
http-body-util = "0.1"
bytes = "1"

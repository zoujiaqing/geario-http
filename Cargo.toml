[workspace]
resolver = "2"
members = ["geario-http", "geario-http-ffi"]

[workspace.package]
authors = ["zoujiaqing <zoujiaqing@gmail.com>"]
repository = "https://github.com/zoujiaqing/geario-http"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.95"

[workspace.lints.rust]
async_fn_in_trait = { level = "allow", priority = -1 }
unknown_lints = { level = "allow", priority = -1 }
rust_2018_idioms = "deny"
warnings = "deny"
missing_debug_implementations = "deny"
unexpected_cfgs = { level = "warn", priority = -2, check-cfg = ['cfg(docsrs_dep)'] }

[workspace.dependencies]
geario-http = { path = "geario-http" }
geario-http-ffi = { path = "geario-http-ffi" }

# geario sits beside this checkout. It is a path dependency rather than a
# version so the two can move together while the IO API is still settling.
geario = { path = "../geario/geario" }

ntex-httparse = "2.1.0"

atoi_simd = "0.18.1"
base64 = "0.22"
bincode = "1.3.3"
bitflags = "2"
coo-kie = { version = "0.18", package = "cookie" }
derive_more = "2.0.1"
encoding_rs = "0.8"
env_logger = { version = "0.11", default-features = false }
flate2 = "1.0"
foldhash = "0.2.0"
futures-core = { version = "0.3.33", default-features = false, features = ["alloc"] }
futures-util = { version = "0.3.33", default-features = false, features = ["alloc"] }
http = "1.5.0"
httparse = "1.10.1"
httpdate = "1.0"
itoa = "1.0.18"
log = "0.4"
mime = "0.3"
percent-encoding = "2.3"
pin-project-lite = "0.2"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
thiserror = "2"

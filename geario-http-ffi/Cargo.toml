[package]
name = "geario-http-ffi"
version = "0.1.0"
description = "C ABI for geario-http"
authors.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "geario_http_ffi"
# staticlib links into a Kotlin/Native binary; cdylib is for local work and
# the JVM; rlib is additive and lets integration tests link the crate.
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[features]
default = ["server", "client"]
# The server runs hyper over geario: HTTP/1.1 and h2c on one port.
server = [
    "dep:hyper",
    "hyper/server",
    "hyper/http1",
    "hyper/http2",
    "dep:http-body-util",
    "dep:async-channel",
    "dep:futures-core","geario-http/hyper-server",
    "geario-http/hyper-http1",
    "geario-http/hyper-http2",
]
native-h1 = ["geario-http/server", "dep:async-channel"]
client = [
    "dep:async-channel",
    "dep:hyper", "hyper/client", "hyper/http1", "hyper/http2",
    "dep:http-body-util", "dep:tls_rustls", "dep:webpki-roots", "dep:futures-core",
    "geario-http/proxy",
    "geario-http/hyper-client",
    "geario-http/hyper-http1",
    "geario-http/hyper-http2",
    "geario-http/rustls",
    "geario/rustls",
]

[dependencies]
geario = { workspace = true }
geario-http = { workspace = true }
hyper = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
async-channel = { workspace = true, optional = true }
futures-core = { workspace = true, optional = true }
log = { workspace = true }
tls_rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }

[dev-dependencies]
# Client connector tests serve real h1/h2 peers without enabling native h1.
geario-http = { workspace = true, features = ["hyper-full"] }
hyper = { workspace = true, features = ["http1", "http2", "server", "client"] }
rcgen = { workspace = true }

[profile.release]
# A panic must not cross the FFI boundary; that is undefined behaviour.
panic = "abort"
lto = true
codegen-units = 1
strip = true

[package]
name = "geario-http"
version = "0.1.0"
description = "HTTP/1.1 protocol layer for geario"
keywords = ["http", "network", "async"]
categories = ["network-programming", "asynchronous"]
authors.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "geario_http"
path = "src/lib.rs"

[lints]
workspace = true

[features]
# A server out of the box; an FFI build can turn this off and name what it needs.
default = ["http1", "server"]
# Everything that is implemented today.
full = ["http1", "client", "server"]

# Protocol versions
http1 = [
    "dep:foldhash",
    "dep:futures-core",
    "dep:httpdate",
    "dep:atoi_simd",
    "dep:httparse",
    "dep:encoding_rs",
    "dep:mime",
    "dep:percent-encoding",
    "dep:base64",
    "dep:serde_urlencoded",
    "dep:serde_json",
    "dep:ntex-httparse",
    "dep:bitflags",
    "dep:pin-project-lite",
    "dep:derive_more",
    "dep:itoa",
    "dep:log",
    "dep:serde",
    "dep:thiserror",
]

# Roles
client = ["http1", "proxy", "geario/http-compat"]
# URL validation shared by native and hyper clients, without the native codec.
proxy = []
server = ["http1"]

# Extras
compress = ["http1", "flate2"]
cookie = ["http1", "coo-kie", "coo-kie/percent-encode"]
trace = []

# TLS through geario's rustls layer.
rustls = ["geario/rustls", "tls_rustls", "webpki-roots"]

# WebSocket, over the same Io as everything else.
ws = ["client", "nanorand"]

# Run upstream hyper on geario's IO, executor and timer.
#
# The protocol versions and roles are hyper's own features, forwarded here so
# a consumer names what it wants once. `hyper-rt` alone brings the adapter
# types and nothing to drive with them.
hyper-rt = ["hyper"]
hyper-http1 = ["hyper-rt", "hyper/http1"]
hyper-http2 = ["hyper-rt", "hyper/http2"]
hyper-server = ["hyper-rt", "hyper/server"]
hyper-client = ["hyper-rt", "hyper/client"]
hyper-full = ["hyper-http1", "hyper-http2", "hyper-server", "hyper-client"]

[dependencies]
geario = { workspace = true }
foldhash = { workspace = true, optional = true }
futures-core = { workspace = true, optional = true }
http = { workspace = true }
httpdate = { workspace = true, optional = true }
atoi_simd = { workspace = true, optional = true }
httparse = { workspace = true, optional = true }
encoding_rs = { workspace = true, optional = true }
mime = { workspace = true, optional = true }
nanorand = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
serde_urlencoded = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
coo-kie = { workspace = true, optional = true }
ntex-httparse = { workspace = true, optional = true }
bitflags = { workspace = true, optional = true }
pin-project-lite = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
tls_rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
derive_more = { workspace = true, optional = true, features = ["debug"] }
itoa = { workspace = true, optional = true }
log = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
# Only to prove a transport test against a known-good transport.
tokio = { version = "1", features = ["rt", "net", "macros", "io-util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
hyper = { workspace = true, features = ["http1", "http2", "client", "server"] }
http-body-util = "0.1"
bincode = { workspace = true }
serde_json = { workspace = true }
geario = { workspace = true }
rand = { workspace = true }
env_logger = { workspace = true }
futures-util = { workspace = true }

[[example]]
name = "hello"
required-features = ["server"]

# Drives the client against the server, so it needs both roles.
[[example]]
name = "roundtrip"
required-features = ["server", "client"]
